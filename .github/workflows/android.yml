name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Env File
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Restore Keystore for Consistent APK Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding custom release keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          fi
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "Decoding repository debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] && [ ! -f my-upload-key.jks ]; then
            echo "Warning: Neither debug.keystore.base64 nor RELEASE_KEYSTORE_BASE64 found. Generating temporary keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Debug Bundle (AAB)
        run: gradle :app:bundleDebug

      - name: Rename artifacts for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SmokeTrack-release-${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/bundle/debug/SmokeTrack-release-${{ github.ref_name }}.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTrack-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTrack-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/SmokeTrack-release-${{ github.ref_name }}.apk
            app/build/outputs/bundle/debug/SmokeTrack-release-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ## 吸烟跟踪 & 戒烟卫士 - ${{ github.ref_name }}
            
            GitHub Actions 自动构建打包发布的 Android 客户端。
            
            ### 📦 资源下载
            * **Android 安装包 (APK)**: [SmokeTrack-release-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SmokeTrack-release-${{ github.ref_name }}.apk)
            * **应用套件 (AAB)**: [SmokeTrack-release-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SmokeTrack-release-${{ github.ref_name }}.aab)
            
            ### 🛠️ 构建说明
            * **构建环境**: GitHub Ubuntu Runner
            * **JDK 版本**: 21 (Temurin)
            * **Gradle 版本**: 9.3.1
            * **签名配置**: 采用项目内预设的安全签名证书
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

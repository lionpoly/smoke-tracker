name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Env File
        run: cp .env.example .env

      - name: Restore signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
              echo "Release signing secrets are required for a tagged build" >&2
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          fi
          # Unit tests and non-release builds use a temporary debug certificate.
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK and Bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleDebug :app:bundleDebug

      - name: Upload Debug APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Betel-and-Smoke-Tracker-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "Betel-and-Smoke-Tracker-${GITHUB_REF_NAME}.apk"

      - name: Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Betel-and-Smoke-Tracker-release-APK
          path: Betel-and-Smoke-Tracker-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Betel-and-Smoke-Tracker-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          name: Betel & Smoke Tracker ${{ github.ref_name }}
          body: |
            ## 榔烟记 / Betel & Smoke Tracker ${{ github.ref_name }}

            本次更新优化烟草首页统计、快捷记录与建议区域布局；支持误删记录撤销，并修复跨日统计刷新。
            槟榔首页在添加或删除记录后会立即更新今日食用、递出和开销等数据。

            下载下方 APK 并在 Android 设备上安装。数据默认保存在本地，可在设置中备份与恢复。

            本安装包为签名的 Release 构建，不是 Debug 构建。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
